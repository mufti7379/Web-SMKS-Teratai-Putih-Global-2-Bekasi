<!doctype html>
<html lang="id">
  <!-- <html lang="en" class="dark"> — uncomment for dark-by-default (replace the tag above; `dark` is a Tailwind variant, never `@apply` it) -->
  <head>
    <meta charset="UTF-8" />
    <!-- Fires the hero-content fetch the instant HTML parsing starts, in parallel with the
         JS bundle download — React would otherwise only call this once the bundle finishes
         downloading, parsing, and mounting, which was the single biggest chunk of the hero
         image's LCP delay. src/lib/preload.ts picks this up instead of re-fetching. -->
    <script>
      window.__PRELOAD__ = {
        hero: fetch('/api/content/hero').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      };
    </script>
    <link rel="icon" type="image/png" href="/logo-tp2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SMK Teratai Putih Global 2 Bekasi — sekolah inspirasi masa depan yang unggul, terpercaya, dan profesional." />
    <title>SMK Teratai Putih Global 2 Bekasi</title>
    <!-- CMS photos and stock fallbacks load from these origins — preconnect so the DNS/TLS
         handshake is already done by the time the hero image request actually fires. -->
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
